# Cấu hình máy chủ chạy trên docker
server:
  # Cấu hình công cụ phân tích hiệu năng
  pprof:
    enable: false # Có bật phân tích hiệu năng pprof không
    port: 6060 # Cổng lắng nghe pprof

# Cấu hình xác thực
auth:
  enable: false # Có bật xác thực không

# Cấu hình trò chuyện
chat:
  max_idle_duration: 30000 # Thời gian rảnh tối đa của phiên (mili giây), 0 không giới hạn
  chat_max_silence_duration: 400 # Ngưỡng im lặng kết thúc câu (mili giây), mặc định 400
  speak_request_reuse_window_ms: 60000 # Cửa sổ tái sử dụng liên kết phát sóng chủ động MQTT-UDP (mili giây)
  realtime_mode: 4 # 1: chế độ ngắt vad 2: chế độ ngắt asr 3: ngắt khi phát hiện giọng nói trong asr 4. ngắt khi có kết quả asr (tương thích với luồng hoặc ngoại tuyến)

chat_hooks:
  enabled: true
  async:
    queue_size: 1024
    worker_count: 1
    drop_when_full: false
    timeout_ms: 200
  plugins:
    statistic_plugin:
      enabled: true
      priority: 100

config_provider: # Tương ứng với provider trong domain/config/
  type: 'manager' # Hiện có thể là manager, redis
  enable_periodic_update: true # Có bật cập nhật cấu hình định kỳ không
  update_interval: '5m' # Khoảng thời gian cập nhật cấu hình, hỗ trợ các đơn vị thời gian như "5m", "1h", "30s"

manager: # Cấu hình quản lý nội bộ, tương ứng với domain/config/manager/manager.go
  # backend_url: "http://127.0.0.1:8080"
  backend_url: 'http://backend:8080' # Địa chỉ quản lý nội bộ
  auth_token: 'milestones_admin_secret_key' # Token gọi HTTP interface nội bộ của bảng điều khiển (giá trị mặc định)
  endpoint_auth_token: 'milestones_mcp_openclaw_secret_key' # MCP/OpenClaw endpoint JWT signature verification Token (giá trị mặc định)
  history_timeout: 5s # Thời gian chờ yêu cầu HTTP

# Lời nhắc hệ thống, xác định vai trò và hành vi của trợ lý AI
system_prompt: 'Bạn là một trợ lý học tập AI thông minh Milestones, có khả năng trò chuyện tự nhiên, trả lời câu hỏi, cung cấp thông tin và hỗ trợ người dùng trong nhiều lĩnh vực. Bạn có thể hiểu ngôn ngữ tự nhiên, phân tích dữ liệu và đưa ra các giải pháp hữu ích. Hãy luôn lịch sự, thân thiện và hữu ích trong các phản hồi của bạn.'

# Cấu hình nhật ký
log:
  path: '../logs/' # Đường dẫn lưu trữ tệp nhật ký
  file: 'server.log' # Tên tệp nhật ký
  level: 'debug' # Mức nhật ký (debug/info/warn/error)
  max_age: 3 # Số ngày lưu giữ tối đa tệp nhật ký
  rotation_time: 10 # Thời gian quay vòng nhật ký (giờ)
  stdout: true # Có xuất ra bảng điều khiển hay không

# Cấu hình cơ sở dữ liệu Redis, được sử dụng để lưu trữ cấu hình thiết bị và lịch sử trò chuyện, tùy chọn
redis:
  # host: "127.0.0.1" # Địa chỉ máy chủ Redis
  host: 'redis'
  port: 6379 # Cổng Redis
  password: 'ticket_dev' # Mật khẩu Redis
  db: 0 # Số cơ sở dữ liệu được sử dụng
  key_prefix: 'milestones' # Tiền tố tên khóa

# Cấu hình dịch vụ WebSocket
websocket:
  host: '0.0.0.0' # Địa chỉ lắng nghe, 0.0.0.0 có nghĩa là lắng nghe tất cả các giao diện mạng
  port: 8989 # Cổng lắng nghe WebSocket

# Cấu hình máy khách MQTT (kết nối với máy chủ MQTT bên ngoài)
mqtt:
  enable: true # Có bật máy khách MQTT không, khi giá trị này là false sẽ đóng máy chủ udp
  broker: '127.0.0.1' # Địa chỉ máy chủ trung gian MQTT
  type: 'tcp' # Loại kết nối
  port: 2883 # Cổng MQTT
  client_id: 'milestones_server' # ID máy khách
  username: 'admin' # Tên người dùng MQTT
  password: 'test!@#' # Mật khẩu MQTT

# Cấu hình máy chủ MQTT (chạy như một máy chủ MQTT)
mqtt_server:
  enable: true # Có bật máy chủ MQTT không
  listen_host: '0.0.0.0' # Địa chỉ lắng nghe
  listen_port: 2883 # Cổng lắng nghe
  client_id: 'milestones_server' # ID máy khách máy chủ
  username: 'admin' # Tên người dùng mặc định
  password: 'test!@#' # Mật khẩu mặc định
  signature_key: 'your_ota_signature_key_here' # Khóa chữ ký cập nhật OTA
  enable_auth: false # Có bật xác thực không
  # Cấu hình kết nối TLS bảo mật
  tls:
    enable: false # Có bật TLS không
    port: 8883 # Cổng TLS
    pem: 'config/server.pem' # Đường dẫn tệp chứng chỉ
    key: 'config/server.key' # Đường dẫn tệp khóa riêng

# Cấu hình dịch vụ UDP
udp:
  external_host: '127.0.0.1' # Địa chỉ truy cập bên ngoài, được gửi xuống địa chỉ trong thông điệp hello
  external_port: 8990 # Cổng truy cập bên ngoài, được gửi xuống cổng trong thông điệp hello
  listen_host: '0.0.0.0' # Địa chỉ lắng nghe
  listen_port: 8990 # Cổng lắng nghe

# Cấu hình nhóm tài nguyên (tất cả các loại tài nguyên chia sẻ cấu hình mặc định)
resource_pools:
  max_size: 1000 # Số lượng tài nguyên tối đa
  min_size: 1 # Số lượng tài nguyên tối thiểu (được tạo trước)
  max_idle: 50 # Số lượng tài nguyên rảnh tối đa
  acquire_timeout: 5s # Thời gian chờ lấy tài nguyên
  idle_timeout: 10m # Thời gian chờ tài nguyên rảnh
  validate_on_borrow: true # Có xác thực tài nguyên khi lấy không
  validate_on_return: true # Có xác minh tài nguyên khi quay lại hay không

# Cấu hình Phát hiện hoạt động giọng nói (VAD)
vad:
  provider: 'ten_vad' # Nhà cung cấp VAD: webrtc_vad, Silero_vad hoặc ten_vad
  # cấu hình webRTC VAD
  webrtc_vad:
    pool_min_size: 5 # Kích thước tối thiểu của nhóm kết nối
    pool_max_size: 1000 # Kích thước tối đa của nhóm kết nối
    pool_max_idle: 100 # Số lượng kết nối rảnh tối đa
    vad_sample_rate: 16000 # Tỷ lệ lấy mẫu VAD
    vad_mode: 2 # Chế độ VAD (0-3, càng cao càng nhạy)
    model_path: 'config/models/vad/silero_vad.onnx' # Đường dẫn tệp mô hình
    threshold: 0.5 # Ngưỡng phát hiện
    min_silence_duration_ms: 100 # Thời gian im lặng tối thiểu (mili giây)
    sample_rate: 16000 # Tỷ lệ lấy mẫu
    channels: 1 # Số kênh
    # pool_size: 10                    # Tùy chọn; nếu không cấu hình sẽ mặc định bằng số lõi CPU
    acquire_timeout_ms: 3000 # Thời gian chờ lấy kết nối (mili giây)
  # TEN-VAD配置
  ten_vad:
    hop_size: 512 # Kích thước khung di chuyển
    threshold: 0.4 # Ngưỡng phát hiện VAD
    pool_size: 10 # Kích thước nhóm tài nguyên
    acquire_timeout_ms: 3000 # Thời gian chờ lấy tài nguyên (mili giây)

# Cấu hình Nhận dạng tiếng nói tự động (ASR)
asr:
  provider: 'funasr' # Nhà cung cấp ASR: funasr / aliyun_funasr / doubao / aliyun_qwen3 / xunfei
  # Cấu hình FunASR
  funasr:
    host: '127.0.0.1' # Địa chỉ máy chủ FunASR
    port: '10096' # Cổng máy chủ FunASR
    mode: 'offline' # Chế độ nhận dạng: offline/online
    sample_rate: 16000 # Tỷ lệ lấy mẫu
    chunk_size: [5, 10, 5] # Kích thước khối cấu hình
    chunk_interval: 10 # Khoảng cách khối (mili giây)
    max_connections: 5 # Số lượng kết nối tối đa
    timeout: 30 # Thời gian chờ (giây)
    auto_end: true # Có tự động kết thúc không
  # Cấu hình Aliyun FunASR
  aliyun_funasr:
    api_key: ''
    ws_url: 'wss://dashscope-intl.aliyuncs.com/api-ws/v1/inference/'
    model: 'fun-asr-realtime'
    format: 'pcm' # only pcm
    sample_rate: 16000 # only 16000
    language_hints: ['vi']
    vocabulary_id: ''
    disfluency_removal_enabled: false
    timeout: 30

  # Doubao ASR config
  doubao:
    appid: 'xxx' # ID ứng dụng
    access_token: 'xxx-Cu' # Mã truy cập
    ws_url: 'wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_nostream' # URL WebSocket
    model_name: 'bigmodel' # Tên mô hình
    end_window_size: 800 # Kích thước cửa sổ kết thúc
    enable_punc: true # Kích hoạt dấu câu
    enable_itn: true # Bật chuẩn hóa văn bản ngược
    enable_ddc: false # Kích hoạt sửa lỗi phát hiện số
    timeout: 30 # Thời gian chờ (giây)

  # Xunfei ASR config
  xunfei:
    appid: '' # ID ứng dụng iFlytek
    api_key: '' # APIKey iFlytek
    api_secret: '' # APISecret iFlytek
    host: 'iat-api.xfyun.cn' # WebSocket tên miền
    path: '/v2/iat' # WebSocket đường dẫn
    domain: 'iat' # Lĩnh vực kinh doanh
    language: 'zh_cn' # Ngôn ngữ
    accent: 'mandarin' # Phương ngôn
    sample_rate: 16000 # Tỷ lệ lấy mẫu
    timeout: 30 # Thời gian chờ (giây)

# Cấu hình chuyển văn bản thành giọng nói (TTS)
tts:
  # provider: "doubao_ws" # nhà cung cấp TTS：milestones/doubao/doubao_ws/cosyvoice/edge/edge_offline/xunfei/xunfei_super_tts
  provider: 'edge'
  openai:
    api_key: 'xxxx' #apikey
    api_url: 'https://api.siliconflow.cn/v1/audio/speech'
    model: 'FunAudioLLM/CosyVoice2-0.5B'
    voice: 'FunAudioLLM/CosyVoice2-0.5B:alex'
    response_format: 'mp3'
    speed: 1.0
    stream: true
  # Cấu hình Doubao TTS (phương thức HTTP)
  doubao: #Về cơ bản đã lỗi thời, không hỗ trợ phát trực tuyến
    appid: '6886011847' # ID ứng dụng
    access_token: 'access_token' # Mã truy cập
    model: 'seed-tts-1.1' # Mô hình
    voice: 'BV001_streaming' # Mô hình giọng nói
    api_url: 'https://openspeech.bytedance.com/api/v3/tts/unidirectional' # Địa chỉ API
  # Cấu hình Doubao TTS (WebSocket), hỗ trợ phát trực tuyến
  doubao_ws:
    appid: '6886011847' # ID ứng dụng
    access_token: 'access_token' # Mã truy cập
    model: 'seed-tts-1.1' # Mô hình
    resource_id: '' # Tùy chọn, bạn nên điền ID phiên bản trong bảng điều khiển, chẳng hạn như TTS-SeedTTS2.xxxxx
    voice: '' # Mô hình giọng nói
    ws_url: 'wss://openspeech.bytedance.com/api/v3/tts/unidirectional/stream' # Địa chỉ WebSocket
  # Cấu hình CosyVoice TTS
  cosyvoice:
    api_url: 'https://tts.linkerai.top/tts' # API地址
    spk_id: 'spk_id' # ID người nói
    frame_duration: 60 # Thời gian duration khung (mili giây)
    target_sr: 24000 # tốc độ lấy mẫu mục tiêu
    audio_format: 'mp3' # Định dạng âm thanh
    instruct_text: '你好' # Văn bản chỉ thị
  # Cấu hình Microsoft Edge TTS
  edge:
    voice: 'zh-CN-XiaoxiaoNeural' # Mô hình giọng nói
    rate: '+0%' # Điều chỉnh tốc độ nói
    volume: '+0%' # Điều chỉnh âm lượng
    pitch: '+0Hz' # Điều chỉnh âm điệu
    connect_timeout: 10 # Thời gian chờ kết nối (giây)
    receive_timeout: 60 # Thời gian chờ nhận (giây)
  # Cấu hình TTS ngoại tuyến Edge
  edge_offline:
    server_url: 'ws://localhost:8080/tts' # Địa chỉ máy chủ
    timeout: 30 # Thời gian hết giờ (giây)
    sample_rate: 16000 # Tốc độ lấy mẫu
    channels: 1 # Số kênh
    frame_duration: 20 # Thời gian duration khung (mili giây)
  # Cấu hình TTS milestones
  milestones:
    server_addr: 'wss://api.tenclass.net/milestones/v1/' # Địa chỉ máy chủ
    device_id: 'ba:8f:17:de:94:94' # ID thiết bị
    client_id: 'e4b0c442-98fc-4e1b-8c3d-6a5b6a5b6a6d' # ID khách hàng
    token: 'test-token' # Token truy cập
  # Cấu hình TTS iFlytek trực tuyến
  xunfei:
    app_id: ''
    api_key: ''
    api_secret: ''
    ws_url: 'wss://tts-api.xfyun.cn/v2/tts'
    voice: 'xiaoyan'
    audio_encoding: 'raw' # raw / opus
    sample_rate: 16000 # 8000 / 16000
    speed: 50 # 0-100
    volume: 50 # 0-100
    pitch: 50 # 0-100
    tte: 'UTF8'
    reg: 0
    rdn: 0
    frame_duration: 60
    connect_timeout: 10
    read_timeout: 30
  # Cấu hình TTS iFlytek siêu thực
  xunfei_super_tts:
    app_id: ''
    api_key: ''
    api_secret: ''
    ws_url: 'wss://cbm01.cn-huabei-1.xf-yun.com/v1/private/mcd9m97e6'
    voice: 'x6_lingxiaoxue_pro'
    audio_encoding: 'raw' # raw / opus
    sample_rate: 24000 # 8000 / 16000 / 24000
    speed: 50
    volume: 50
    pitch: 50
    bgs: 0
    reg: 0
    rdn: 0
    rhy: 0
    oral_level: 'mid'
    spark_assist: 1
    stop_split: 0
    remain: 0
    frame_duration: 60
    connect_timeout: 10
    read_timeout: 30

# Cấu hình mô hình ngôn ngữ lớn (LLM)
llm:
  provider: 'openrouter'
  # provider: "qwen_72b" # Mặc định sử dụng LLM nhà cung cấp
  # DeepSeek V3 Cấu hình mô hình (nền tảng siliconflow)
  deepseek:
    type: 'openai' # Loại mô hình
    model_name: 'Pro/deepseek-ai/DeepSeek-V3' # Tên mô hình
    api_key: 'api_key'
    base_url: 'https://api.siliconflow.cn/v1' # Địa chỉ API
    max_tokens: 500 # Số lượng token được tạo tối đa
  # DeepSeek V2.5 Cấu hình mô hình (nền tảng siliconflow)
  deepseek2_5:
    type: 'openai' # Loại mô hình
    model_name: 'deepseek-ai/DeepSeek-V2.5' # Tên mô hình
    api_key: 'api_key'
    base_url: 'https://api.siliconflow.cn/v1' # Địa chỉ API
    max_tokens: 500 # Số lượng token được tạo tối đa
  # Cấu hình Qweb72B (nền tảng siliconflow)
  qwen_72b:
    type: 'openai' # Loại mô hình
    model_name: 'Qwen/Qwen2.5-72B-Instruct' # Tên mô hình
    api_key: 'api_key'
    base_url: 'https://api.siliconflow.cn/v1' # Địa chỉ API
    max_tokens: 500 # Số lượng token được tạo tối đa
  # Cấu hình mô hình ChatGLM (Zhipu AI)
  chatglmllm:
    type: 'openai' # Loại mô hình
    model_name: 'glm-4-flash' # Tên mô hình
    base_url: 'https://open.bigmodel.cn/api/paas/v4/' # Địa chỉ API
    api_key: 'api_key'
    max_tokens: 500 # Số lượng token được tạo tối đa
  # Cấu hình đám mây Alibaba Tongyi Qianwen
  aliyun_qwen:
    type: 'openai' # Loại mô hình
    model_name: 'qwen2.5-72b-instruct' # Tên mô hình
    base_url: 'https://dashscope.aliyuncs.com/compatible-mode/v1' # Địa chỉ API
    api_key: 'api_key'
    max_tokens: 500 # Số lượng token được tạo tối đa
  # Cấu hình mô hình DeepSeek
  doubao_deepseek:
    type: 'openai' # Loại mô hình
    model_name: 'deepseek-v3' # Tên mô hình
    api_key: 'api_key'
    base_url: 'https://ark.cn-beijing.volces.com/api/v3' # Địa chỉ API
    max_tokens: 500 # Số lượng token được tạo tối đa
  # Cấu hình mô hình OpenRouter
  openrouter:
    type: 'openai'
    model_name: 'openai/gpt-oss-120b:free'
    api_key: 'api_key'
    base_url: 'https://openrouter.ai/api/v1'
    max_tokens: 500

# Cấu hình nhận dạng trực quan (thị giác máy tính)
vision:
  enable_auth: false # Có bật xác thực hay không
  vision_url: 'http://192.168.1.97:8989/milestones/api/vision' # Địa chỉ API Vision được cấp cho thiết bị
  # Cấu hình mô hình ngôn ngữ hình ảnh
  vllm:
    provider: 'aliyun_vision' # Nhà cung cấp mô hình trực quan
    # Cấu hình mô hình trực quan của Đám mây Alibaba
    aliyun_vision:
      type: 'openai' # Loại mô hình
      model_name: 'qwen-vl-plus-latest' # Tên mô hình
      base_url: 'https://dashscope.aliyuncs.com/compatible-mode/v1' # Địa chỉ API
      api_key: 'api_key'
      max_token: 500 # Số lượng token được tạo tối đa
    # Cấu hình mô hình trực quan Doubao
    doubao_vision:
      type: 'openai' # Loại mô hình
      model_name: 'doubao-1.5-vision-lite-250315' # Tên mô hình
      api_key: 'api_key'
      base_url: 'https://ark.cn-beijing.volces.com/api/v3' # Địa chỉ API
      max_tokens: 500 # Số lượng token được tạo tối đa

# Cấu hình OTA (kết nối qua mạng)
ota:
  signature_key: 'your_ota_signature_key_here' # signature_key OTA
  # Cấu hình môi trường thử nghiệm, để thử nghiệm nội bộ
  test:
    websocket:
      url: 'ws://192.168.1.97:18989/milestones/v1/' # Địa chỉ WebSocket
    mqtt:
      enable: false # Khi đúng, mqtt sẽ được cấu hình cho thiết bị
      endpoint: '192.168.1.97' # Điểm cuối MQTT, có thể lấy cổng
  # Cấu hình môi trường bên ngoài, dùng cho môi trường trực tuyến
  external:
    websocket:
      url: 'wss://www.tb263.cn:55555/go_ws/milestones/v1/' # Địa chỉ WebSocket
    mqtt:
      enable: false # Khi đúng, mqtt sẽ được cấu hình cho thiết bị
      endpoint: 'www.youdomain.cn' # Điểm cuối MQTT, có thể lấy cổng

# Cấu hình MCP (Giao thức điều khiển mô hình)
mcp:
  # Cấu hình máy chủ MCP toàn cục
  global:
    enabled: true # Có bật MCP hay không
    servers:
      # Máy chủ MCP hệ thống tập tin
      - name: 'filesystem'
        type: 'sse' # Kiểu kết nối: SSE
        url: 'http://localhost:3001/sse' # Địa chỉ máy chủ
        enabled: true # Có bật hay không
      # Máy chủ MCP bộ nhớ
      - name: 'memory'
        type: 'streamablehttp' # Kiểu kết nối: HTTP luồng
        url: 'http://localhost:3002/mcp' # Địa chỉ máy chủ
        enabled: true # Có bật hay không
    reconnect_interval: 300 # Khoảng thời gian kết nối lại (giây)
    max_reconnect_attempts: 10 # Số lần thử kết nối lại tối đa

# Cấu hình công cụ MCP cục bộ
local_mcp:
  exit_conversation: true # Cho phép thoát cuộc trò chuyện
  clear_conversation_history: true # Cho phép xóa lịch sử trò chuyện

# Memory 长记忆配置
memory:
  provider: 'nomemo' # Nhà cung cấp bộ nhớ: nomemo (không có bộ nhớ dài) llm (bộ nhớ đàm thoại ngắn hạn, dựa trên Redis) hoặc memobase (bộ nhớ dài hạn)
  # Cấu hình LLM Memory (bộ nhớ hội thoại ngắn hạn)
  # Sử dụng Redis để lưu trữ, cấu hình xem phần redis ở trên
  nomemo:
    # Không cần cấu hình bổ sung, sử dụng cấu hình redis toàn cục
  # Cấu hình Memobase (lưu trữ bộ nhớ dài hạn)
  memobase:
    base_url: 'https://api.memobase.dev' # URL dự án Memobase
    api_key: 'your_memobase_api_key_here' # Memobase API
    api_version: 'v1' # Phiên bản API
    enable_search: true #Cho phép tìm kiếm bộ nhớ trước khi gọi llm, sẽ có độ trễ khoảng 200ms
    search_threshold: 0.5 #Ngưỡng tìm kiếm, 0,5 có nghĩa là chỉ khi độ tương tự giữa bộ nhớ tìm kiếm và đầu vào của người dùng vượt quá 0,5 thì nó mới được thêm vào đầu vào của llm
    search_top_k: 3 #Tìm kiếm TopK có nghĩa là trong số các ký ức được tìm kiếm, ký ức TopK có độ tương đồng cao nhất sẽ được thêm vào đầu vào của llm.
  mem0:
    api_key: 'your_mem0_api_key_here'
    base_url: 'https://api.mem0.ai'
    enable_search: true #Cho phép tìm kiếm bộ nhớ trước khi gọi llm, sẽ có độ trễ khoảng 200ms
    search_threshold: 0.5 #Ngưỡng tìm kiếm, 0,5 có nghĩa là chỉ khi độ tương tự giữa bộ nhớ tìm kiếm và đầu vào của người dùng vượt quá 0,5 thì nó mới được thêm vào đầu vào của llm
    search_top_k: 3 #Tìm kiếm TopK có nghĩa là trong số các ký ức được tìm kiếm, ký ức TopK có độ tương đồng cao nhất sẽ được thêm vào đầu vào của llm.

# Bật tin nhắn chào mừng
enable_greeting: true

# Danh sách lời chào (chọn ngẫu nhiên)
greeting_list:
  - 'Xin chào, tôi là Milestones, rất vui được gặp bạn!'
  - 'Chào bạn, tôi là Milestones, hôm nay tôi có thể giúp gì cho bạn?'

# đánh thức danh sách từ
wakeup_words:
  - 'Milestones'
  - 'Hey Milestones'

voice_identify:
  enable: true
  # base_url: "http://192.168.1.97:8080"
  base_url: 'http://voice-server:8080'
  threshold: 0.4 # Ngưỡng nhận dạng giọng nói, phạm vi 0,0-1,0, mặc định 0,6
